worker_processes  1;
events {
    worker_connections  2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  165;
    
    # 设置客户端请求体大小限制
    client_max_body_size 100M;
    
    # 添加调试日志
    log_format  main  '### $remote_addr - $remote_user [$time_local] "$request" '
                      '### $status $body_bytes_sent "$http_referer" '
                      '### "$http_user_agent" "$http_x_forwarded_for" '
                      '### "$http_x_user_email" "$http_x_user_name"';
    access_log  /var/log/nginx/access.log  main;
    
    server {
        listen 12138;# YOUR GUEST MODE ENTRY

        # 所有请求都代理到后端
        location / {
            proxy_pass http://10.20.12.36:18080;
            # 设置客户端请求体大小限制
            client_max_body_size 100M;
            
            proxy_set_header X-User-Email "user@local.host";
            proxy_set_header X-User-Name "user";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 添加调试头
            add_header X-Debug-Email $http_x_user_email;
            add_header X-Debug-Name $http_x_user_name;
        }
    }
}